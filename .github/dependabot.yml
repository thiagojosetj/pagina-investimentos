version: 2

# Atualizações minor e patch chegam agrupadas em uma pull request por ecossistema.
# Atualizações major ficam fora dos grupos e chegam uma por vez, para que uma quebra
# de compatibilidade possa ser avaliada e revertida isoladamente.

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-compativel:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-compativel:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-compativel:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
