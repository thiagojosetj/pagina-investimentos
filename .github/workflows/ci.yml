name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Verify backend and PostgreSQL migration
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Check types
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  demo-image:
    name: Public demo image
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build single-service image
        run: docker build --tag portfolio-demo:ci .

      - name: Smoke-test the packaged site and API
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach \
            --memory 512m \
            --env SPRING_PROFILES_ACTIVE=demo \
            --publish 127.0.0.1:10000:10000 portfolio-demo:ci)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          ready=false
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:10000/actuator/health | grep -q '"UP"'; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs "$container_id"
            exit 1
          fi

          page=$(curl --fail --silent --dump-header /tmp/demo-page-headers http://127.0.0.1:10000/)
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/demo-page-headers
          grep -qi '^X-Frame-Options: DENY' /tmp/demo-page-headers
          grep -qi '^Referrer-Policy: no-referrer' /tmp/demo-page-headers
          grep -qi '^Cross-Origin-Opener-Policy: same-origin' /tmp/demo-page-headers
          grep -qi "^Content-Security-Policy: default-src 'self';" /tmp/demo-page-headers
          grep -qi '^Cache-Control: no-cache' /tmp/demo-page-headers
          # O HTML nunca recebe o cache imutavel dos assets versionados.
          if grep -qi '^Cache-Control:.*\(immutable\|max-age=[1-9]\)' /tmp/demo-page-headers; then
            exit 1
          fi
          grep -q 'Planejador de Carteira' <<< "$page"
          script_path=$(grep -oE 'src="/assets/[^"]+\.js"' <<< "$page" | head -n 1 | cut -d '"' -f 2)
          test -n "$script_path"
          curl --fail --silent --output /dev/null --dump-header /tmp/demo-asset-headers \
            "http://127.0.0.1:10000$script_path"
          grep -qi '^Cache-Control:.*max-age=31536000.*immutable' /tmp/demo-asset-headers
          curl --fail --silent --header 'Accept-Encoding: gzip' --output /dev/null \
            --dump-header /tmp/demo-gzip-headers "http://127.0.0.1:10000$script_path"
          grep -qi '^Content-Encoding: gzip' /tmp/demo-gzip-headers
          curl --fail --silent http://127.0.0.1:10000/favicon.svg | grep -q '<svg'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:10000/v3/api-docs)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:10000/swagger-ui/index.html)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:10000/actuator/info)" = 404
          response=$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"currency":"BRL","contribution":"100.00","allocations":[{"classId":"stocks","name":"Ações","currentAmount":"60.00","targetPercentage":"50.0000"},{"classId":"funds","name":"Fundos","currentAmount":"40.00","targetPercentage":"50.0000"}]}' \
            http://127.0.0.1:10000/api/v1/allocation-simulations/contributions)
          grep -q '"suggestedContribution":"40.00"' <<< "$response"
          sales_response=$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"currency":"BRL","contribution":"0.00","includeSales":true,"allocations":[{"classId":"stocks","name":"Ações","currentAmount":"60.00","targetPercentage":"50.0000"},{"classId":"funds","name":"Fundos","currentAmount":"40.00","targetPercentage":"50.0000"}]}' \
            http://127.0.0.1:10000/api/v1/allocation-simulations/contributions)
          grep -q '"includeSales":true' <<< "$sales_response"
          grep -q '"suggestedSale":"10.00"' <<< "$sales_response"
          grep -q '"suggestedPurchase":"10.00"' <<< "$sales_response"
          oversized_status=$(head -c 65537 /dev/zero | tr '\0' ' ' | curl --silent --show-error \
            --header 'Content-Type: application/json' --data-binary @- \
            --dump-header /tmp/demo-oversized-headers --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:10000/api/v1/allocation-simulations/contributions)
          test "$oversized_status" = 413
          grep -qi '^Content-Security-Policy:' /tmp/demo-oversized-headers
