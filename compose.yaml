name: pagina-investimentos

services:
  postgres:
    image: postgres:18.6-bookworm
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${PORTFOLIO_POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${PORTFOLIO_POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${PORTFOLIO_POSTGRES_PASSWORD:-portfolio_local}
    ports:
      - "127.0.0.1:${PORTFOLIO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
