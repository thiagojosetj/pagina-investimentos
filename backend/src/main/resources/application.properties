spring.application.name=portfolio-api
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

spring.datasource.url=jdbc:postgresql://${PORTFOLIO_POSTGRES_HOST:localhost}:${PORTFOLIO_POSTGRES_PORT:5433}/${PORTFOLIO_POSTGRES_DB:portfolio}
spring.datasource.username=${PORTFOLIO_POSTGRES_USER:portfolio}
spring.datasource.password=${PORTFOLIO_POSTGRES_PASSWORD:portfolio_local}
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

info.app.name=Planejador de Carteira API
info.app.version=0.1.0
