# Ambiente privado: sem identidade sintetica ou credenciais de fallback.
server.forward-headers-strategy=none
portfolio.security.origin=${PORTFOLIO_PUBLIC_ORIGIN:}
portfolio.security.google.client-id=${PORTFOLIO_GOOGLE_CLIENT_ID:}
portfolio.security.google.client-secret=${PORTFOLIO_GOOGLE_CLIENT_SECRET:}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
